<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Back Card -->
  <rect x="5" y="5" width="22" height="15" rx="3.5" fill="#8e8e93" opacity="0.35"/>
  <!-- Front Card (Apple Pay / Titanium style) -->
  <rect x="2" y="9" width="25" height="16" rx="3.5" fill="#1d1d1f"/>
  <!-- Edge Specular Highlight -->
  <rect x="2.5" y="9.5" width="24" height="15" rx="3" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>
  <!-- Realistic Micro EMV Chip -->
  <rect x="5.5" y="14" width="4.5" height="3.5" rx="1" fill="#e5e5ea" stroke="#8e8e93" stroke-width="0.5"/>
  <!-- Contactless NFC waves symbol -->
  <path d="M22 13.5a3 3 0 0 1 0 4M23.8 12a5 5 0 0 1 0 7" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-linecap="round"/>
</svg>
